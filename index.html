<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<title>近所の飲食店ランキング</title>
<style>
  :root{
    --bg:#0f1115; --bg2:#12151c; --card:#181c24; --border:#262c38;
    --text:#eef1f6; --muted:#9aa4b2; --accent:#ffb020; --accent-ink:#1a1200;
    --accent2:#4da3ff; --danger:#ff7a7a; --success:#5dd39e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;font-size:15px;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:var(--accent2);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font-family:inherit;cursor:pointer;border:0}
  button:disabled{opacity:.5;cursor:not-allowed}

  /* Header */
  header{
    padding:14px 16px;background:var(--bg2);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:10;backdrop-filter:blur(8px);
    display:flex;align-items:center;gap:12px;
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  header .title{flex:1;min-width:0}
  header h1{margin:0;font-size:17px;font-weight:700}
  header .sub{margin:2px 0 0;font-size:11px;color:var(--muted)}
  .icon-btn{
    width:38px;height:38px;border-radius:10px;background:transparent;
    color:var(--muted);font-size:18px;display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{background:var(--card);color:var(--text)}

  main{max-width:720px;margin:0 auto;padding:16px 12px 32px}

  /* Panels */
  .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
  .panel h2{margin:0 0 8px;font-size:15px}
  .panel p{margin:0 0 14px;color:var(--muted);font-size:13px}

  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  input[type=text],input[type=password]{
    width:100%;padding:12px 14px;background:#0c0f14;border:1px solid var(--border);
    border-radius:10px;color:var(--text);font-size:15px;outline:none;
  }
  input:focus{border-color:var(--accent)}

  /* Primary button (big search) */
  .primary{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    padding:18px;border-radius:14px;font-size:17px;font-weight:700;
    background:var(--accent);color:var(--accent-ink);
    box-shadow:0 4px 18px rgba(255,176,32,.25);
    transition:transform .08s ease;
  }
  .primary:active:not(:disabled){transform:scale(.98)}
  .secondary{
    padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;
    background:#232a36;color:var(--text);border:1px solid var(--border);
  }
  .secondary.danger{color:var(--danger);border-color:#3a2228}

  /* Status bar */
  .status{
    margin-top:12px;font-size:13px;color:var(--muted);min-height:1.4em;
    display:flex;align-items:center;gap:8px;
  }
  .status.err{color:var(--danger)}
  .status.ok{color:var(--success)}
  .spinner{
    width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Filter chips */
  .filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin-bottom:4px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{
    flex-shrink:0;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;
    background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;
    white-space:nowrap;transition:all .15s;
  }
  .chip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .chip:hover:not(.active){border-color:var(--muted)}

  .results-meta{font-size:12px;color:var(--muted);margin:0 2px 10px}

  /* Shop card */
  .list{display:flex;flex-direction:column;gap:12px}
  .shop{
    display:flex;gap:14px;padding:14px;background:var(--card);
    border:1px solid var(--border);border-radius:14px;
    transition:border-color .15s,transform .08s;
    text-decoration:none;color:inherit;
  }
  .shop:hover{border-color:#3a4254}
  .shop:active{transform:scale(.995)}
  .shop .rank{
    position:absolute;top:6px;left:6px;
    background:rgba(0,0,0,.7);color:var(--accent);
    font-weight:800;font-size:12px;padding:2px 7px;border-radius:999px;
  }
  .thumb-wrap{position:relative;flex-shrink:0}
  .thumb{
    width:92px;height:92px;border-radius:10px;object-fit:cover;
    background:#0c0f14;display:block;
  }
  .thumb.empty{display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--border)}
  .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .name{font-weight:700;font-size:16px;margin:0;line-height:1.35;
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .catch{font-size:12px;color:var(--muted);margin:0;line-height:1.4;
         display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .tag{
    font-size:11px;padding:3px 9px;border-radius:999px;
    background:#222a36;color:#c7d0dc;border:1px solid var(--border);
    white-space:nowrap;
  }
  .tag.walk{background:rgba(77,163,255,.12);color:var(--accent2);border-color:rgba(77,163,255,.3)}
  .tag.budget{background:rgba(255,176,32,.12);color:var(--accent);border-color:rgba(255,176,32,.3)}
  .access{font-size:11px;color:var(--muted);margin:0;
          display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

  /* Empty state */
  .empty-state{
    text-align:center;padding:40px 20px;color:var(--muted);
    background:var(--card);border:1px dashed var(--border);border-radius:14px;
  }
  .empty-state .big-icon{font-size:44px;margin-bottom:10px}

  /* Modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;padding:0;
    animation:fadeIn .15s;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{
    width:100%;max-width:500px;background:var(--card);
    border-top:1px solid var(--border);border-radius:18px 18px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    animation:slideUp .2s;
  }
  @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal h2{margin:0 0 6px;font-size:16px}
  .modal .close-row{display:flex;gap:8px;margin-top:14px}
  .modal .close-row button{flex:1}

  [hidden]{display:none !important}

  @media (min-width:600px){
    .modal-backdrop{align-items:center}
    .modal{border-radius:18px;max-width:460px}
  }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>🍜 近所の飲食店ランキング</h1>
    <p class="sub">現在地から徒歩10分以内のお店</p>
  </div>
  <button id="settingsBtn" class="icon-btn" title="設定" hidden>⚙️</button>
</header>

<main>
  <!-- Setup panel: shown only when API key is missing -->
  <div class="panel" id="setupPanel" hidden>
    <h2>初回セットアップ</h2>
    <p>HotPepper グルメサーチAPIのキーが必要です。<br>
       <a href="https://webservice.recruit.co.jp/register/" target="_blank" rel="noopener">こちら</a> から無料登録できます。</p>
    <label for="apiKey">APIキー</label>
    <input id="apiKey" type="password" placeholder="APIキーを貼り付け" autocomplete="off" inputmode="text" />
    <div style="margin-top:14px">
      <button id="saveKey" class="primary">保存して開始</button>
    </div>
    <div class="status" id="setupStatus"></div>
  </div>

  <!-- Action panel: shown only when API key is set -->
  <div class="panel" id="actionPanel" hidden>
    <button id="searchBtn" class="primary">📍 現在地から検索</button>
    <div class="status" id="status"></div>
  </div>

  <!-- Filter chips (genre) -->
  <div class="filters" id="filters" hidden></div>

  <!-- Results meta (count) -->
  <p class="results-meta" id="resultsMeta" hidden></p>

  <!-- Results list -->
  <div class="list" id="list"></div>
</main>

<!-- Settings modal -->
<div class="modal-backdrop" id="settingsModal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h2>設定</h2>
    <p style="margin:0 0 14px;color:var(--muted);font-size:13px">APIキーの変更・削除ができます。</p>
    <label for="apiKeyEdit">HotPepper APIキー</label>
    <input id="apiKeyEdit" type="password" placeholder="APIキー" autocomplete="off" />
    <div class="close-row">
      <button id="saveKeyEdit" class="primary" style="padding:13px">保存</button>
      <button id="clearKey" class="secondary danger">削除</button>
    </div>
    <div class="close-row">
      <button id="closeSettings" class="secondary" style="flex:1">閉じる</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const KEY_STORAGE = 'hotpepper_api_key';
  const WALK_SPEED = 80;   // m/min
  const MAX_WALK = 10;     // min
  const CORS_PROXY = 'https://corsproxy.io/?';

  let lastShops = [];      // all shops fetched (already walk-filtered)
  let activeGenre = null;

  // ---- Key mgmt ----
  const getKey = () => localStorage.getItem(KEY_STORAGE) || '';
  const setKey = (k) => localStorage.setItem(KEY_STORAGE, k);
  const clearKey = () => localStorage.removeItem(KEY_STORAGE);

  function updateKeyUI(){
    const hasKey = !!getKey();
    $('setupPanel').hidden = hasKey;
    $('actionPanel').hidden = !hasKey;
    $('settingsBtn').hidden = !hasKey;
  }

  // ---- Setup flow ----
  $('saveKey').onclick = () => {
    const k = $('apiKey').value.trim();
    const st = $('setupStatus');
    if(!k){ st.textContent = 'キーを入力してください'; st.className = 'status err'; return; }
    setKey(k);
    updateKeyUI();
    $('status').textContent = '準備完了。ボタンを押して検索してください。';
    $('status').className = 'status ok';
  };

  // ---- Settings modal ----
  const modal = $('settingsModal');
  $('settingsBtn').onclick = () => {
    $('apiKeyEdit').value = getKey();
    modal.hidden = false;
  };
  $('closeSettings').onclick = () => { modal.hidden = true; };
  modal.onclick = (e) => { if(e.target === modal) modal.hidden = true; };
  $('saveKeyEdit').onclick = () => {
    const k = $('apiKeyEdit').value.trim();
    if(!k) return;
    setKey(k);
    modal.hidden = true;
    $('status').textContent = 'APIキーを更新しました';
    $('status').className = 'status ok';
  };
  $('clearKey').onclick = () => {
    if(!confirm('APIキーを削除しますか?')) return;
    clearKey();
    modal.hidden = true;
    lastShops = [];
    renderResults([]);
    $('filters').hidden = true;
    $('resultsMeta').hidden = true;
    updateKeyUI();
  };

  // ---- Geolocation ----
  function getLocation(){
    return new Promise((resolve, reject) => {
      if(!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1'){
        return reject(new Error('このページはHTTPSではないため位置情報を取得できません'));
      }
      if(!navigator.geolocation) return reject(new Error('このブラウザは位置情報に対応していません'));
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
        (err) => {
          const msgs = {
            1: '位置情報の利用が拒否されました。ブラウザの設定で許可してください。',
            2: '位置情報を取得できませんでした。OSの位置情報サービスがONか確認してください。',
            3: '位置情報の取得がタイムアウトしました。再試行してください。',
          };
          reject(new Error(msgs[err.code] || ('位置情報取得エラー: ' + err.message)));
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
      );
    });
  }

  // ---- HotPepper API (via CORS proxy) ----
  async function fetchShops(key, lat, lng){
    const api = 'https://webservice.recruit.co.jp/hotpepper/gourmet/v1/'
      + '?key=' + encodeURIComponent(key)
      + '&lat=' + lat + '&lng=' + lng
      + '&range=3&count=100&format=json&datum=world';
    const url = CORS_PROXY + encodeURIComponent(api);
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    let res;
    try { res = await fetch(url, { signal: ctrl.signal }); }
    catch(e){
      clearTimeout(timer);
      if(e.name === 'AbortError') throw new Error('APIタイムアウト（15秒応答なし）');
      throw new Error('ネットワークエラー: ' + e.message);
    }
    clearTimeout(timer);
    if(!res.ok) throw new Error('APIエラー (HTTP ' + res.status + ')');
    const data = await res.json();
    if(data.results && data.results.error){
      throw new Error('APIエラー: ' + (data.results.error[0] && data.results.error[0].message || 'unknown'));
    }
    return (data.results && data.results.shop) || [];
  }

  // ---- Distance (Haversine) ----
  function distanceM(lat1, lng1, lat2, lng2){
    const R = 6371000, toRad = (d) => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  // ---- Render ----
  const escapeHtml = (s) => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function renderFilters(shops){
    const filtersEl = $('filters');
    if(!shops.length){ filtersEl.hidden = true; filtersEl.innerHTML = ''; return; }
    const genreCounts = {};
    shops.forEach(s => {
      const g = (s.genre && s.genre.name) || 'その他';
      genreCounts[g] = (genreCounts[g] || 0) + 1;
    });
    const genres = Object.entries(genreCounts).sort((a,b) => b[1] - a[1]);
    const chips = [`<button class="chip${activeGenre===null?' active':''}" data-genre="">すべて (${shops.length})</button>`]
      .concat(genres.map(([g, c]) => `<button class="chip${activeGenre===g?' active':''}" data-genre="${escapeHtml(g)}">${escapeHtml(g)} (${c})</button>`));
    filtersEl.innerHTML = chips.join('');
    filtersEl.hidden = false;
    filtersEl.querySelectorAll('.chip').forEach(btn => {
      btn.onclick = () => {
        activeGenre = btn.dataset.genre || null;
        applyFilter();
      };
    });
  }

  function applyFilter(){
    const filtered = activeGenre
      ? lastShops.filter(s => (s.genre && s.genre.name) === activeGenre)
      : lastShops;
    // Update chip active state
    document.querySelectorAll('#filters .chip').forEach(c => {
      c.classList.toggle('active', (c.dataset.genre || null) === activeGenre);
    });
    renderResults(filtered);
  }

  function renderResults(shops){
    const list = $('list');
    const meta = $('resultsMeta');
    if(!shops.length){
      list.innerHTML = '<div class="empty-state"><div class="big-icon">🍽️</div>該当するお店が見つかりませんでした</div>';
      meta.hidden = true;
      return;
    }
    meta.hidden = false;
    meta.textContent = `${shops.length} 件（徒歩の近い順）`;
    list.innerHTML = shops.map((s, i) => {
      const thumb = (s.photo && s.photo.mobile && s.photo.mobile.l) || (s.photo && s.photo.mobile && s.photo.mobile.s) || '';
      const genre = s.genre && s.genre.name;
      const budget = s.budget && s.budget.name;
      const catchPhrase = s.genre && s.genre.catch;
      const access = s.access;
      return `
        <a class="shop" href="${escapeHtml(s.urls && s.urls.pc || '#')}" target="_blank" rel="noopener">
          <div class="thumb-wrap">
            ${thumb
              ? `<img class="thumb" src="${escapeHtml(thumb)}" alt="" loading="lazy" />`
              : `<div class="thumb empty">🍴</div>`}
            <span class="rank">#${i+1}</span>
          </div>
          <div class="info">
            <h3 class="name">${escapeHtml(s.name)}</h3>
            ${catchPhrase ? `<p class="catch">${escapeHtml(catchPhrase)}</p>` : ''}
            <div class="tags">
              <span class="tag walk">🚶 徒歩${s.walkMin}分</span>
              ${genre ? `<span class="tag">${escapeHtml(genre)}</span>` : ''}
              ${budget ? `<span class="tag budget">💴 ${escapeHtml(budget)}</span>` : ''}
            </div>
            ${access ? `<p class="access">📍 ${escapeHtml(access)}</p>` : ''}
          </div>
        </a>
      `;
    }).join('');
  }

  // ---- Search flow ----
  async function runSearch(){
    const key = getKey();
    if(!key) return;
    const status = $('status');
    const btn = $('searchBtn');
    btn.disabled = true;
    status.className = 'status';
    status.innerHTML = '<span class="spinner"></span>位置情報を取得中...';
    try{
      const loc = await getLocation();
      status.innerHTML = '<span class="spinner"></span>お店を検索中...';
      const shops = await fetchShops(key, loc.lat, loc.lng);
      const processed = shops
        .map(s => {
          const d = distanceM(loc.lat, loc.lng, parseFloat(s.lat), parseFloat(s.lng));
          return Object.assign({}, s, { distM: d, walkMin: Math.max(1, Math.ceil(d / WALK_SPEED)) });
        })
        .filter(s => s.walkMin <= MAX_WALK)
        .sort((a, b) => a.distM - b.distM);
      lastShops = processed;
      activeGenre = null;
      renderFilters(processed);
      renderResults(processed);
      status.textContent = processed.length
        ? `✓ ${processed.length} 件見つかりました`
        : '徒歩10分以内にお店がありませんでした';
      status.className = 'status ok';
    } catch(e){
      status.textContent = '✗ ' + e.message;
      status.className = 'status err';
    } finally {
      btn.disabled = false;
    }
  }
  $('searchBtn').onclick = runSearch;

  // ---- Init ----
  updateKeyUI();
})();
</script>
</body>
</html>
